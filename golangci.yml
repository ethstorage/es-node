version: "2"

run:
  concurrency: 4
  timeout: 5m
  modules-download-mode: readonly
  tests: true
  issues-exit-code: 10

output:
  formats:
    text:
      path: stdout
      print-issued-lines: true
      print-linter-name: true
      colors: true

linters:
  default: none
  exclusions:
    generated: lax
    rules:
      - linters:
          - errorlint
        text: errors\.(As|Is)
    paths:
      - (^|/)(bin|vendor|third_party|testdata|examples|Godeps|builtin)/

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - (^|/)(bin|vendor|third_party|testdata|examples|Godeps|builtin)/

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
